name: gitaction
on: push

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Running a single command
        run: echo "This is my first github action command"

      - name: Checking the OS release
        run: cat /etc/os-release

  lint-code-base:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit with status code 1 if there are any linting errors
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

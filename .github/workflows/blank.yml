name: gitaction
on: push
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Run a one-line script
        run: echo Hello, world!
      - name: to check the OS version
        run: cat "/etc/os-release"
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: to check the present DIR
        uses: pwd
      - name: Run a one-line script
        run: echo Hello, world!
      - name: to check the OS version
        run: cat "/etc/os-release"
